[project]
name = "vlm-stereo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jaefree", email = "jaepeiso@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-vlm>=0.7.12",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
vlm-stereo = "vlm_stereo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
